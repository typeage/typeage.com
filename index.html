<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>TypeAge | Future. Engineered.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Trebuchet MS', sans-serif;
            background-color: #f9f9f9;
            color: #111;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            max-width: 500px;
            margin-bottom: 2rem;
        }

        form {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        input[type="email"] {
            padding: 0.75rem 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            flex: 1;
        }

        button {
            padding: 0.75rem 1.2rem;
            border: none;
            background-color: #111;
            color: white;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #333;
        }

        .email-link {
            font-size: 0.8rem;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .email-link:hover {
            opacity: 1;
        }

        footer {
            position: absolute;
            bottom: 1rem;
            font-size: 0.8rem;
            padding: 4px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.25rem;
            }

            form {
                flex-direction: column;
                width: 100%;
            }

            input[type="email"], button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>TypeAge</h1>
    <p>Future. Engineered.</p>
    <div>
        <a class="email-link" href="mailto:hi@typeage.com?subject=I%20want%20to%20build%20a%20website"
           aria-label="Email hi@typeage.com"
           style="display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none;color:inherit;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                 aria-hidden="true">
                <path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7.5" stroke="#111" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 6H3v.5l9 6 9-6V6z" stroke="#111" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
            <span style="font-size:1rem;">hi@typeage.com</span>
        </a>
    </div>
</div>
</body>
</html>
